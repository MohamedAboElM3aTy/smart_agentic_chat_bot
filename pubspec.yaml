name: smart_agentic_chat_bot
description: "Smart agentic e-commerce chatbot — GDG Cairo Build with AI workshop."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_ai: ^3.12.1
  firebase_app_check: ^0.4.4+1

  # State management
  flutter_riverpod: ^3.3.1
  riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Navigation
  auto_route: ^10.0.0

  # Networking
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0

  # Storage
  shared_preferences: ^2.3.0

  # UI
  skeletonizer: ^2.1.3
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  google_fonts: ^8.1.0
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3
  auto_route_generator: ^10.0.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  requests_inspector: ^5.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  config:
    enable-swift-package-manager: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/agentic_app_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
